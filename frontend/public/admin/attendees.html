<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Attendees - EventGenie Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#059669',
            secondary: '#7C3AED',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: 0, transform: 'translateY(10px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
          },
          animation: {
            fadeInUp: 'fadeInUp 0.6s ease forwards',
          },
        },
      },
    };
  </script>
</head>

<body
  class="min-h-screen bg-gradient-to-br from-primary to-secondary text-white flex flex-col font-sans m-0 transition-colors duration-300">

  <!-- Professional Navigation -->
  <div id="navbar-container"></div>

  <!-- Page Content -->
  <main class="flex-1 pt-20 px-6 pb-6">
    <div class="max-w-7xl mx-auto space-y-8">

      <!-- Header -->
      <div class="flex flex-col space-y-6">
        <!-- Title Section -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-4 sm:space-y-0">
          <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold">Manage Attendees</h1>
          <a href="dashboard.html"
            class="inline-flex items-center px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition duration-200 text-sm sm:text-base font-semibold shadow-lg hover:shadow-xl">
            <i class="bi bi-arrow-left mr-2"></i>
            Back to Dashboard
          </a>
        </div>

        <!-- Search and Filter Section -->
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
          <div class="flex-1">
            <input type="text" id="searchInput" placeholder="Search attendees..."
              class="w-full px-4 py-3 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-secondary border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white transition duration-200" />
          </div>
          <div class="sm:w-48">
            <select id="statusFilter"
              class="w-full px-4 py-3 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-secondary border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white transition duration-200">
              <option value="">All Attendees</option>
              <option value="accepted">Confirmed</option>
              <option value="pending">Pending</option>
              <option value="declined">Declined</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Attendees Table -->
      <div class="bg-white dark:bg-gray-800 shadow rounded-lg overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700">
              <tr>
                <th
                  class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                  Attendee</th>
                <th
                  class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                  Event</th>
                <th
                  class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                  Status</th>
                <th
                  class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                  Sent Date</th>
                <th
                  class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                  Response Date</th>
                <th
                  class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                  Actions</th>
              </tr>
            </thead>
            <tbody id="attendeesTableBody"
              class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
              <!-- Data will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div id="loadingIndicator" class="hidden text-center py-8">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>
        <p class="mt-2 text-white">Loading attendees...</p>
      </div>

      <!-- No Attendees Message -->
      <div id="noAttendees" class="hidden text-center py-8 text-white">
        <p>No attendees found.</p>
      </div>

      <!-- Attendee Details Modal -->
      <div id="attendeeModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Attendee Details</h2>
            <button onclick="closeAttendeeModal()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
              <i class="bi bi-x-lg text-xl"></i>
            </button>
          </div>

          <div id="attendeeModalContent" class="space-y-4">
            <!-- Content will be loaded here -->
          </div>

          <div class="flex justify-end mt-6">
            <button onclick="closeAttendeeModal()"
              class="px-4 py-2 bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-400 dark:hover:bg-gray-500 transition duration-200 font-semibold">
              Close
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>
  <!-- Footer -->
  <footer
    class="text-center py-4 text-gray-700 dark:text-gray-300 text-sm bg-white bg-opacity-10 backdrop-blur-md mt-auto">
    &copy; 2025 EventGenie. All rights reserved.
  </footer>

  <script src="../../assets/js/display_menu.js"></script>
  <!-- Load Navbar -->
  <script>
    let allAttendees = [];

    fetch('../../shared/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;

        // Set active state for Manage Attendees
        const navAttendees = document.getElementById('nav-admin-attendees');
        const mobileNavAttendees = document.getElementById('mobile-nav-admin-attendees');
        if (navAttendees) navAttendees.classList.add('bg-primary');
        if (mobileNavAttendees) mobileNavAttendees.classList.add('bg-primary');

        // Initialize navbar menus after loading
        initializeNavbarMenus();
        showRoleBasedNavigation();

        // Load attendees data
        loadAttendees();
      })
      .catch(error => console.error('Error loading navbar:', error));

    // Function to check authentication and role
    function checkAuth() {
      const token = localStorage.getItem('token');
      const userData = localStorage.getItem('user');

      if (!token || !userData) {
        window.location.href = '../login.html';
        return false;
      }

      try {
        const user = JSON.parse(userData);
        if (user.role !== 'admin') {
          alert('Access denied. Admin privileges required.');
          window.location.href = '../login.html';
          return false;
        }
        
        // Check if admin is active
        const status = user.status || 'pending_approval';
        if (status === 'blocked' || status === 'pending_approval') {
          alert('Your account is not active. Please contact support.');
          window.location.href = '../login.html';
          return false;
        }
        
        return true;
      } catch (error) {
        window.location.href = '../login.html';
        return false;
      }
    }

    async function loadAttendees() {
      if (!checkAuth()) return;

      const loadingIndicator = document.getElementById('loadingIndicator');
      const noAttendees = document.getElementById('noAttendees');
      const tableBody = document.getElementById('attendeesTableBody');
      
      loadingIndicator.classList.remove('hidden');
      tableBody.innerHTML = '';
      noAttendees.classList.add('hidden');
      
      try {
        const token = localStorage.getItem('token');
        const response = await fetch('../../../backend/api.php/attendees', {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        if (response.ok) {
          allAttendees = await response.json();
          loadingIndicator.classList.add('hidden');
          if (allAttendees.length === 0) {
            noAttendees.classList.remove('hidden');
          } else {
            displayAttendees(allAttendees);
          }
        } else if (response.status === 401) {
          loadingIndicator.classList.add('hidden');
          alert('Session expired. Please login again.');
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          window.location.href = '../login.html';
        } else {
          loadingIndicator.classList.add('hidden');
          const error = await response.json();
          alert('Failed to load attendees: ' + (error.error || 'Unknown error'));
        }
      } catch (error) {
        loadingIndicator.classList.add('hidden');
        alert('Network error: ' + error.message);
        console.error('Error loading attendees:', error);
      }
    }

    function displayAttendees(attendees) {
      const tbody = document.getElementById('attendeesTableBody');
      tbody.innerHTML = '';
      attendees.forEach(attendee => {
        const initials = attendee.name ? attendee.name.split(' ').map(n => n[0]).join('').toUpperCase() : 'N/A';
        const statusClass = {
          'accepted': 'bg-green-100 text-green-800 dark:bg-green-800 dark:text-green-100',
          'pending': 'bg-yellow-100 text-yellow-800 dark:bg-yellow-800 dark:text-yellow-100',
          'declined': 'bg-red-100 text-red-800 dark:bg-red-800 dark:text-red-100'
        }[attendee.status] || 'bg-gray-100 text-gray-800 dark:bg-gray-800 dark:text-gray-100';
        const sentDate = attendee.sent_at ? new Date(attendee.sent_at).toLocaleDateString() : 'N/A';
        const rsvpDate = attendee.responded_at ? new Date(attendee.responded_at).toLocaleDateString() : 'Not yet responded';
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="w-10 h-10 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center text-white font-bold">
                ${initials}
              </div>
              <div class="ml-4">
                <div class="text-sm font-medium text-gray-900 dark:text-white">${escapeHtml(attendee.name || 'N/A')}</div>
                <div class="text-sm text-gray-500 dark:text-gray-400">${escapeHtml(attendee.email || 'N/A')}</div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm text-gray-900 dark:text-white">${escapeHtml(attendee.event_name || 'N/A')}</div>
            <div class="text-sm text-gray-500 dark:text-gray-400">${attendee.event_date ? new Date(attendee.event_date).toLocaleDateString() : 'N/A'}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusClass}">
              ${attendee.status ? attendee.status.charAt(0).toUpperCase() + attendee.status.slice(1) : 'Unknown'}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${sentDate}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${rsvpDate}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <button onclick="viewAttendee(${attendee.invitation_id})" class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300 mr-3">View</button>
            <button onclick="removeAttendee(${attendee.invitation_id}, '${escapeHtml(attendee.name || 'N/A')}')" class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300">Remove</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.toString().replace(/[&<>"']/g, m => map[m]);
    }

    // Add event listeners for search and filter
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');

      searchInput.addEventListener('input', filterAttendees);
      statusFilter.addEventListener('change', filterAttendees);
    });

    function filterAttendees() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      const filtered = allAttendees.filter(attendee => {
        const matchesSearch = (attendee.name && attendee.name.toLowerCase().includes(searchTerm)) || 
                              (attendee.email && attendee.email.toLowerCase().includes(searchTerm)) ||
                              (attendee.event_name && attendee.event_name.toLowerCase().includes(searchTerm));
        const matchesStatus = !statusFilter || attendee.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      displayAttendees(filtered);
    }

    async function viewAttendee(invitationId) {
      const modal = document.getElementById('attendeeModal');
      const modalContent = document.getElementById('attendeeModalContent');
      
      modalContent.innerHTML = '<div class="text-center py-8"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div><p class="mt-2 text-gray-600 dark:text-gray-400">Loading...</p></div>';
      modal.classList.remove('hidden');
      
      try {
        const token = localStorage.getItem('token');
        const response = await fetch(`../../../backend/api.php/attendees/${invitationId}`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        
        if (response.ok) {
          const attendee = await response.json();
          
          // Get status badge styling
          const statusClass = {
            'accepted': 'bg-green-100 text-green-800 dark:bg-green-800 dark:text-green-100',
            'pending': 'bg-yellow-100 text-yellow-800 dark:bg-yellow-800 dark:text-yellow-100',
            'declined': 'bg-red-100 text-red-800 dark:bg-red-800 dark:text-red-100'
          }[attendee.status] || 'bg-gray-100 text-gray-800 dark:bg-gray-800 dark:text-gray-100';
          
          const initials = attendee.name ? attendee.name.split(' ').map(n => n[0]).join('').toUpperCase() : 'N/A';
          
          modalContent.innerHTML = `
            <div class="flex items-center space-x-4 mb-6 pb-4 border-b border-gray-200 dark:border-gray-700">
              <div class="w-16 h-16 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center text-white font-bold text-xl">
                ${initials}
              </div>
              <div>
                <h3 class="text-xl font-bold text-gray-900 dark:text-white">${escapeHtml(attendee.name || 'N/A')}</h3>
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium ${statusClass} mt-2">
                  ${attendee.status ? attendee.status.charAt(0).toUpperCase() + attendee.status.slice(1) : 'Unknown'}
                </span>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Email</label>
                <p class="text-gray-900 dark:text-white mt-1">${escapeHtml(attendee.email || 'N/A')}</p>
              </div>

              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Phone</label>
                <p class="text-gray-900 dark:text-white mt-1">${escapeHtml(attendee.phone || 'N/A')}</p>
              </div>

              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 md:col-span-2">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Event Name</label>
                <p class="text-gray-900 dark:text-white mt-1">${escapeHtml(attendee.event_name || 'N/A')}</p>
              </div>

              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Event Date</label>
                <p class="text-gray-900 dark:text-white mt-1">${attendee.event_date ? new Date(attendee.event_date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'N/A'}</p>
              </div>

              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Event Type</label>
                <p class="text-gray-900 dark:text-white mt-1">${escapeHtml(attendee.event_type || 'N/A')}</p>
              </div>

              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Guest Count</label>
                <p class="text-gray-900 dark:text-white mt-1">${attendee.guest_count || 'N/A'}</p>
              </div>

              ${attendee.venue_name ? `
              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Venue</label>
                <p class="text-gray-900 dark:text-white mt-1">${escapeHtml(attendee.venue_name)}${attendee.location ? ` - ${escapeHtml(attendee.location)}` : ''}</p>
              </div>
              ` : ''}

              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Invitation ID</label>
                <p class="text-gray-900 dark:text-white mt-1">${attendee.invitation_id || 'N/A'}</p>
              </div>

              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Sent Date</label>
                <p class="text-gray-900 dark:text-white mt-1">${attendee.sent_at ? new Date(attendee.sent_at).toLocaleString('en-US', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'N/A'}</p>
              </div>

              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Response Date</label>
                <p class="text-gray-900 dark:text-white mt-1">${attendee.responded_at ? new Date(attendee.responded_at).toLocaleString('en-US', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Not yet responded'}</p>
              </div>

              ${attendee.description ? `
              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 md:col-span-2">
                <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Event Description</label>
                <p class="text-gray-900 dark:text-white mt-1">${escapeHtml(attendee.description)}</p>
              </div>
              ` : ''}
            </div>
          `;
        } else {
          const error = await response.json();
          modalContent.innerHTML = `
            <div class="text-center py-8">
              <i class="bi bi-exclamation-triangle text-4xl text-red-500 mb-4"></i>
              <p class="text-red-600 dark:text-red-400">Error: ${escapeHtml(error.error || 'Failed to load attendee details')}</p>
            </div>
          `;
        }
      } catch (error) {
        modalContent.innerHTML = `
          <div class="text-center py-8">
            <i class="bi bi-exclamation-triangle text-4xl text-red-500 mb-4"></i>
            <p class="text-red-600 dark:text-red-400">Network error: ${escapeHtml(error.message)}</p>
          </div>
        `;
      }
    }

    // Function to close attendee modal
    function closeAttendeeModal() {
      document.getElementById('attendeeModal').classList.add('hidden');
    }

    async function removeAttendee(invitationId, attendeeName) {
      if (!confirm(`Are you sure you want to remove ${attendeeName} from this event? This action cannot be undone.`)) {
        return;
      }
      
      try {
        const token = localStorage.getItem('token');
        const response = await fetch(`../../../backend/api.php/attendees/${invitationId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        
        if (response.ok) {
          const result = await response.json();
          alert('Attendee removed successfully');
          // Reload attendees list
          loadAttendees();
        } else {
          const error = await response.json();
          alert('Failed to remove attendee: ' + (error.error || 'Unknown error'));
        }
      } catch (error) {
        alert('Network error: ' + error.message);
      }
    }

    // Close modal when clicking outside
    document.getElementById('attendeeModal').addEventListener('click', function(event) {
      if (event.target === this) {
        closeAttendeeModal();
      }
    });

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('attendeeModal');
        if (!modal.classList.contains('hidden')) {
          closeAttendeeModal();
        }
      }
    });
  </script>
</body>

</html>
